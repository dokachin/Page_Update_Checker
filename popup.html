<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ページ更新チェッカー</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<section id="cur">
  <div class="label">表示中のページ</div>
  <div id="curTitle" class="ttl"></div>
  <div id="curUrl" class="url"></div>

  <div id="registered" class="note" hidden></div>
  <div id="unsupported" class="note" hidden>このページは登録できません（http / https のみ）。</div>

  <form id="form" hidden>
    <div class="grid">
      <label>フォルダ
        <input id="fFolder" type="text" list="folderList" placeholder="任意">
        <datalist id="folderList"></datalist>
      </label>
      <label>間隔（分）
        <input id="fInterval" type="number" min="0" step="1" title="0 = 手動のみ">
      </label>
    </div>
    <label>チェック方法
      <select id="fMethod">
        <option value="content">内容（本文の変化）</option>
        <option value="lastmod">更新日時（Last-Modified）</option>
        <option value="size">サイズ</option>
        <option value="meta">METAタグ（WWWC）</option>
      </select>
    </label>
    <button id="btnAdd" type="submit" class="primary">このページを追加</button>
  </form>
  <div id="msg" class="note ok" hidden></div>
</section>

<section>
  <div class="label">未読の更新 <span id="unreadCount"></span></div>
  <ul id="unread"></ul>
</section>

<footer>
  <button id="btnCheck">すべてチェック</button>
  <button id="btnRead">既読にする</button>
  <button id="btnOpen">管理画面</button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
